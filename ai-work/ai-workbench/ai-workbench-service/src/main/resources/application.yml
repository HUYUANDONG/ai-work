spring:
  application:
    name: ai-workbench-service
  profiles:
    default: local
  config:
    import: classpath:wb-base.yml
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      discovery:
        server-addr: ${wb.nacos.server-addr}
        namespace: ${wb.nacos.discovery-namespace}
        enabled: ${wb.nacos.discovery-enabled}
        ip: ${WB_NACOS_DISCOVERY_IP:}
      config:
        server-addr: ${wb.nacos.server-addr}
        namespace: ${wb.nacos.discovery-namespace}
        enabled: ${wb.nacos.config-enabled}
        import-check:
          enabled: false
    inetutils:
      preferred-networks: 192.168.
      ignored-interfaces: VMware.*,vEthernet.*,Hyper-V.*,docker.*,蓝牙.*,本地连接.*
    loadbalancer:
      nacos:
        enabled: ${wb.nacos.discovery-enabled}
  datasource:
    url: ${WB_MYSQL_URL:${wb.mysql.url}}
    username: ${WB_MYSQL_USERNAME:${wb.mysql.username}}
    password: ${WB_MYSQL_PASSWORD:${wb.mysql.password}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      username: ${WB_MYSQL_USERNAME:${wb.mysql.username}}
      password: ${WB_MYSQL_PASSWORD:${wb.mysql.password}}
      initial-size: 2
      min-idle: 2
      max-active: 20
      connection-init-sqls: SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED
  flyway:
    enabled: ${wb.mysql.enabled}
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  # 约定：SQL 写在 resources/mapper/*.xml，接口只留方法签名
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input
      table-underline: true

server:
  port: ${wb.service.port}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
  protocol:
    name: dubbo
    port: -1
  registry:
    address: ${WB_DUBBO_REGISTRY:${wb.dubbo.registry-address}}
    parameters:
      namespace: ${wb.dubbo.registry-namespace}
      group: ${wb.dubbo.registry-group}
  consumer:
    timeout: ${wb.dubbo.consumer-timeout-ms}
    check: false
    retries: 0
  provider:
    retries: 0
  scan:
    base-packages: cn.aiworkbench.service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
