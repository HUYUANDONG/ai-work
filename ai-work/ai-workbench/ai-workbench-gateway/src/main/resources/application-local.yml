wb:
  security:
    allow-unsigned-identity: true

# 跨设备时 Gateway 填 Service 的局域网地址，例如：
# WB_SERVICE_URI=http://192.168.50.175:8080
# 或走 Nacos：WB_SERVICE_URI=lb://ai-workbench-service（Service 必须注册 192.168 而不是 169.254）
logging:
  level:
    cn.aiworkbench: INFO
    org.springframework.cloud.gateway: INFO
